format = """
$directory\
$git_branch\
$git_status\
$fill\
$line_break\
$character"""

add_newline = true
palette = "github_dark_dimmed"

[fill]
symbol = '·'
style = 'fg:gray'

[directory]
style = 'bold fg:blue'
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
style = 'fg:purple'
symbol = ' '
format = '[on](fg:gray) [$symbol$branch ]($style)'

# Configuración detallada de Git
[git_status]
style = 'fg:orange'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '!'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↕${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '?${count}'
stashed = '󰏗${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '-${count}'

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
vimcmd_symbol = '[](bold green)'

[palettes.github_dark_dimmed]
# Colores principales de GitHub Dark Dimmed
blue = '#539bf5'
green = '#57ab5a'
orange = '#c69026'
purple = '#a371f7'
red = '#e5534b'
yellow = '#c69026'
cyan = '#76e3ea'
# Colores de texto
gray = '#768390'
bright-black = '#636e7b'
white = '#adbac7'
# Fondo
black = '#22272e'