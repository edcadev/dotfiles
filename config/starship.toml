format = """
$directory\
$git_branch\
$git_status\
$fill\
$line_break\
$character"""

add_newline = true
palette = "catppuccin_macchiato"

[fill]
symbol = '·'
style = 'fg:overlay0'

[directory]
style = 'bold fg:blue'
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
style = 'fg:mauve'
symbol = ' '
format = '[on](fg:overlay1) [$symbol$branch ]($style)'

# Configuración detallada de Git
[git_status]
style = 'fg:peach'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '!'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↕${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '?${count}'
stashed = '󰏗${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '-${count}'

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
vimcmd_symbol = '[](bold green)'

[palettes.catppuccin_macchiato]
# Catppuccin Macchiato — mismo esquema que SketchyBar (config/sketchybar/colors.sh)
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
